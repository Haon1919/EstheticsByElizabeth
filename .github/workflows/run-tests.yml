name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  test:
    name: Run .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore tests/API.Tests/API.Tests.csproj

      - name: Build
        run: dotnet build tests/API.Tests/API.Tests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/API.Tests/API.Tests.csproj --configuration Release --no-build --logger "console;verbosity=detailed" --results-directory ./test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 30
