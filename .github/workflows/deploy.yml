# Esthetics by Elizabeth — Continuous Deployment to Azure Static Web Apps
name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"

jobs:
  # Gate deployment behind tests
  test:
    name: Pre-deploy Tests
    uses: ./.github/workflows/run-tests.yml

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Angular frontend
          app_location: "/frontend"
          output_location: "dist/app/browser"
          # .NET Isolated Azure Functions API
          api_location: "/api"
        env:
          API_BUILD_COMMAND: "dotnet publish -c Release"
